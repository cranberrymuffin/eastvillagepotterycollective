<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Members | East Village Pottery Collective</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css?v=10" />
  </head>
  <body>
    <main class="page membership-page">
      <site-nav></site-nav>
      <article class="membership-card">
        <header class="membership-header">
          <p class="contact-label">East Village Pottery Collective</p>
          <h1>Members</h1>
          <p class="membership-lede">
            This is the members-only portal for East Village Pottery Collective.
          </p>
        </header>

        <p class="agreement-section form-status" id="page-status" hidden></p>

        <section
          class="agreement-section"
          id="login-view"
          aria-labelledby="login-heading"
          hidden
        >
          <h2 id="login-heading">Log in</h2>
          <form class="member-form" id="login-form">
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button class="button" type="submit">Log in</button>
            <p class="form-status" role="status" aria-live="polite"></p>
            <button
              class="link-button"
              type="button"
              id="resend-confirmation"
              hidden
            >
              Resend confirmation email
            </button>
            <p class="auth-options">
              <button class="link-button" type="button" id="forgot-password">
                Forgot password?
              </button>
            </p>
          </form>
          <p class="auth-switch">
            New here?
            <button class="link-button" type="button" data-auth-view="signup">
              Create an account
            </button>
          </p>
        </section>

        <section
          class="agreement-section"
          id="signup-view"
          aria-labelledby="signup-heading"
          hidden
        >
          <h2 id="signup-heading">Create an account</h2>
          <p>
            Sign up to log your pieces for bisque firing.
          </p>
          <form class="member-form" id="signup-form">
            <label class="field">
              <span>Name</span>
              <input
                type="text"
                name="name"
                autocomplete="name"
                maxlength="100"
                required
              />
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Password (at least 8 characters)</span>
              <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>
            <tier-picker name="tier" required></tier-picker>
            <payment-fields></payment-fields>
            <button class="button" type="submit">Create account</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-switch">
            Already have an account?
            <button class="link-button" type="button" data-auth-view="login">
              Log in
            </button>
          </p>
        </section>

        <div id="app-view" hidden>
          <section class="agreement-section" aria-labelledby="calendar-heading">
            <h2 id="calendar-heading">Studio calendar</h2>
            <event-calendar></event-calendar>
          </section>

          <section class="agreement-section" aria-labelledby="feed-heading">
            <h2 id="feed-heading">Posts</h2>
            <member-feed></member-feed>
          </section>
        </div>
      </article>
    </main>
    <script type="module" src="/components/site-nav.js?v=3"></script>
    <script type="module" src="/members/members.js?v=5"></script>
  </body>
</html>
