<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn about East Village Pottery Collective and its studio."
    />
    <title>About | East Village Pottery Collective</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page about-page">
      <article class="contact-card" aria-labelledby="about-label">
        <section class="about-section" aria-labelledby="about-label">
          <p class="contact-label" id="about-label">About the studio</p>
          <p class="about-intro">
            A shared pottery studio with the equipment and space to make, learn,
            and work alongside a creative community.
          </p>
          <div class="about-layout">
            <div class="studio-gallery" aria-label="Inside the studio">
              <figure>
                <img
                  src="images/wheel.jpeg"
                  alt="Pottery wheel in the studio"
                />
                <figcaption>Four wheels for throwing.</figcaption>
              </figure>
              <figure>
                <img
                  src="images/handbuilding.jpeg"
                  alt="Handbuilding work surface"
                />
                <figcaption>Two surfaces for handbuilding.</figcaption>
              </figure>
              <figure>
                <img
                  src="images/shelf.jpeg"
                  alt="Studio shelves with pottery and supplies"
                />
                <figcaption>Shelf space for works in progress.</figcaption>
              </figure>
              <figure>
                <img src="images/kiln.jpeg" alt="Kiln in the studio" />
                <figcaption>A Cone 6, food-safe kiln.</figcaption>
              </figure>
              <figure>
                <img
                  src="images/pottery.jpeg"
                  alt="Handmade pottery in the studio"
                />
                <figcaption>Community-made pottery.</figcaption>
              </figure>
              <figure>
                <img
                  src="images/pottery-2.jpeg"
                  alt="Finished pottery on studio shelving"
                />
                <figcaption>Objects made in the studio.</figcaption>
              </figure>
            </div>
            <ul class="studio-features">
              <li><strong>4</strong><span>pottery wheels</span></li>
              <li><strong>2</strong><span>handbuilding surfaces</span></li>
              <li><strong>Open</strong><span>shelf space for storage</span></li>
              <li>
                <strong>Shared</strong
                ><span>community tools and reclaim clay</span>
              </li>
              <li><strong>1</strong><span>studio sink</span></li>
              <li><strong>Cone 6</strong><span>food-safe kiln firing</span></li>
            </ul>
          </div>
        </section>
      </article>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
