<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visit East Village Pottery Collective." />
    <title>East Village Pottery Collective</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section
        class="contact-card"
        aria-label="East Village Pottery Collective"
      >
        <div class="storefront">
          <img
            src="images/storefront.png"
            alt="East Village Pottery Collective storefront"
          />
        </div>

        <div class="contact-content">
          <section
            class="info-section visit-section"
            id="visit"
            aria-labelledby="visit-label"
          >
            <p class="contact-label" id="visit-label">Visit</p>
            <a
              class="address-link"
              href="https://www.google.com/maps/search/?api=1&query=197+E.+7th+St+New+York+NY+10009"
              aria-label="Open 197 E. 7th St, New York, NY 10009 in maps"
            >
              197 E. 7th St<br />
              New York, NY 10009
            </a>
          </section>

          <section
            class="info-section contact-section"
            id="contact"
            aria-labelledby="contact-label"
          >
            <p class="contact-label" id="contact-label">Contact</p>
            <a
              class="email-link phone-link"
              href="tel:+16467617711"
              aria-label="Call studio owner Elizabeth Mikesell at plus one 646 761 7711"
            >
              +1 (646) 761-7711
            </a>
            <a class="email-link" href="mailto:evpotterycollective@gmail.com">
              evpotterycollective@gmail.com
            </a>
          </section>
        </div>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
